name: auto host site
on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '**/*.js'
  push:
    branches:
      - gh-actions
jobs:
  host-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v6
      
      - name: install dependencies
        run: |
          cd site
          npm ci

      - name: start server
        run: |
          node app.js &
          echo $! > server.pid

      - name: Wait for server
        run: |
          npx wait-on http://localhost:3000/

      - name: stop server
        if: always()
        run: kill $(cat server.pid)